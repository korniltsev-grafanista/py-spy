name: macOS thread activity

on:
  pull_request:
    branches: [master]
  push:
    branches: [master, validation/macos-thread-activity-before]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  thread-activity:
    strategy:
      fail-fast: false
      matrix:
        os: [macos-latest]
        python: ["3.10", "3.11", "3.12", "3.13", "3.14", "3.15"]
        include:
          - os: macos-15-intel
            python: "3.13"
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: ${{ matrix.python }}
      - uses: Swatinem/rust-cache@v2
      - run: cargo build --locked
      - run: cargo test --locked --no-run
      - name: Check native IDs and sleeping thread activity
        run: sudo "PATH=$PATH" "CARGO_HOME=$HOME/.cargo" "RUSTUP_HOME=$HOME/.rustup" cargo test --locked test_macos_native_thread_id_activity -- --nocapture
      - name: Check complete CPU and wall profiles
        if: success() || failure()
        run: sudo "PATH=$PWD/target/debug:$PATH" python tests/integration_test.py TestPyspy.test_thread_activity_profiles
